name: RSI 4h options study

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance
      - run: python study_rsi4h.py
      - run: |
          git config user.name "overnight-desk-bot"
          git config user.email "overnight-desk-bot@users.noreply.github.com"
          git add rsi4h_results.md rsi4h_trades.csv
          git commit -m "RSI 4h study results $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
